<header>
<h1>🚒 Letní večer SDH Lubina II Větřkovice</h1>
<h2>18. července 2026</h2>
<h1>🚒 SDH Lubina – Motání hadic</h1>
<h3>Firestore verze</h3>
</header>

<div class="karta">
<h3>Přidání soutěžícího</h3>

<div>
<input id="prijmeni" placeholder="Příjmení">
<input id="jmeno" placeholder="Jméno">
<button id="btnPridat">Přidat</button>
<button onclick="pridat()">Přidat</button>
</div>

<div class="karta">

<table>
<thead>
<tr id="hlavicka">
<th>Poř.</th>
<tr>
<th>#</th>
<th>Příjmení</th>
<th>Jméno</th>
<th>Akce</th>
<th>Nejlepší</th>
<th>Pokus 1</th>
<th>Akce</th>
</tr>
</thead>

<tbody id="vysledky"></tbody>
<tbody id="tab"></tbody>
</table>

</div>

</div>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
getFirestore,
collection,
addDoc,
onSnapshot,
deleteDoc,
doc,
updateDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";


// 🔥 SEM DOPLŇ SVŮJ CONFIG
const firebaseConfig = {
apiKey: "XXX",
authDomain: "XXX",
projectId: "XXX"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

<script>
const col = collection(db, "soutez");

let soutezici = [];
let dalsiId = 1;
let maxPokusu = 1;
let data = [];

document.getElementById("btnPridat").addEventListener("click", pridejSouteziciho);
// realtime načítání
onSnapshot(col, (snap) => {

function pridejSouteziciho(){
data = [];

snap.forEach(d => {
data.push({ id: d.id, ...d.data() });
});

render();

});

const p = document.getElementById("prijmeni").value.trim();
const j = document.getElementById("jmeno").value.trim();
window.pridat = async function(){

const p = document.getElementById("prijmeni").value;
const j = document.getElementById("jmeno").value;

if(!p || !j) return;

soutezici.push({
id: dalsiId++,
prijmeni: p,
jmeno: j,
pokusy: [],
nejlepsi: ""
await addDoc(col,{
prijmeni:p,
jmeno:j,
nejlepsi:"-"
});

document.getElementById("prijmeni").value="";
document.getElementById("jmeno").value="";

vykresli();
}

function vykresli(){
window.smaz = async function(id){
await deleteDoc(doc(db,"soutez",id));
}

const tbody = document.getElementById("vysledky");
tbody.innerHTML="";
window.render = function(){

soutezici.forEach((z,i)=>{
const t = document.getElementById("tab");
t.innerHTML="";

const tr = document.createElement("tr");
data.forEach((z,i)=>{

tr.innerHTML = `
t.innerHTML += `
<tr>
<td>${i+1}</td>
<td>${z.prijmeni}</td>
<td>${z.jmeno}</td>
<td>${z.nejlepsi || "-"}</td>
<td>
<button onclick="pridatPokus(${z.id})">➕</button>
<button onclick="edit(${z.id})">✏️</button>
<button onclick="smaz(${z.id})">🗑️</button>
<button onclick="smaz('${z.id}')">🗑️</button>
</td>
<td class="${z.nejlepsi ? 'nejlepsi' : ''}">${z.nejlepsi || '-'}</td>
</tr>
`;

for(let i=0;i<maxPokusu;i++){
tr.innerHTML += `<td>${z.pokusy[i] || ''}</td>`;
}

tbody.appendChild(tr);

});

}

function pridatPokus(id){

const cas = prompt("Zadej čas (15:23)");
if(!cas) return;

const z = soutezici.find(s=>s.id===id);

z.pokusy.push(cas);

// nové sloupce
if(z.pokusy.length > maxPokusu){

maxPokusu = z.pokusy.length;

const th = document.createElement("th");
th.textContent = "Pokus " + maxPokusu;

document.getElementById("hlavicka").appendChild(th);
}

// výpočet nejlepšího času (SAFE)
if(z.pokusy.length === 0) return;

let nej = z.pokusy[0];

for(let i=1;i<z.pokusy.length;i++){

const [m1,s1] = nej.split(":").map(Number);
const [m2,s2] = z.pokusy[i].split(":").map(Number);

if((m2*60+s2) < (m1*60+s1)){
nej = z.pokusy[i];
}

}

z.nejlepsi = nej;

vykresli();
}

function edit(id){

const z = soutezici.find(s=>s.id===id);

const p = prompt("Příjmení:", z.prijmeni);
if(p===null || p.trim()==="") return;

const j = prompt("Jméno:", z.jmeno);
if(j===null || j.trim()==="") return;

z.prijmeni = p.trim();
z.jmeno = j.trim();

vykresli();
}

function smaz(id){

soutezici = soutezici.filter(s=>s.id!==id);
vykresli();

}

function upravitPokus(id,index){

const z = soutezici.find(s=>s.id===id);

const novy = prompt("Upravit čas:", z.pokusy[index]);
if(!novy) return;

z.pokusy[index]=novy;

// přepočet
let nej = z.pokusy[0];

for(let i=1;i<z.pokusy.length;i++){

const [m1,s1] = nej.split(":").map(Number);
const [m2,s2] = z.pokusy[i].split(":").map(Number);

if((m2*60+s2) < (m1*60+s1)){
nej = z.pokusy[i];
}

}

z.nejlepsi = nej;

vykresli();

}

</script>

</body>
