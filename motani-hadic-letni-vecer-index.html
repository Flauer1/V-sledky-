<!DOCTYPE html>
<html lang="cs">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Motání hadic na čas</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#ececec;
padding:20px;
}

.container{
max-width:1600px;
margin:auto;
background:#fff;
padding:25px;
border-radius:12px;
box-shadow:0 0 20px rgba(0,0,0,.15);
}

h1{
text-align:center;
color:#c62828;
margin-bottom:5px;
}

h2{
text-align:center;
color:#666;
font-weight:normal;
margin-bottom:30px;
}

.card{
background:#fafafa;
border:1px solid #ddd;
border-radius:10px;
padding:20px;
margin-bottom:25px;
}

.form{
display:flex;
gap:15px;
align-items:end;
flex-wrap:wrap;
}

.form div{
min-width:220px;
flex:1;
}

label{
display:block;
margin-bottom:5px;
font-weight:bold;
}

input{
width:100%;
padding:10px;
font-size:16px;
border:1px solid #bbb;
border-radius:5px;
}

button{
padding:10px 18px;
font-size:15px;
border:none;
border-radius:5px;
cursor:pointer;
background:#2e7d32;
color:white;
}

button:hover{
opacity:.9;
}

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
}

th{
background:#c62828;
color:white;
padding:10px;
}

td{
border:1px solid #ddd;
padding:8px;
text-align:center;
}

tr:nth-child(even){
background:#f7f7f7;
}

.akce button{
margin:0 2px;
padding:5px 8px;
}

.nejlepsi{
background:#c8e6c9;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h1>🚒 Letní večer SDH Lubina II Větřkovice</h1>

<h2>18. července 2026</h2>

<div class="card">

<div class="form">

<div>

<label>Příjmení</label>

<input id="prijmeni">

</div>

<div>

<label>Jméno</label>

<input id="jmeno">

</div>

<div>

<button
id="pridatSouteziciho"
type="button">

➕ Přidat soutěžícího

</button>

</div>

</div>

</div>

<div class="card">

<table id="tabulka">

<thead>

<tr id="hlavicka">

<th>Poř.</th>

<th>Příjmení</th>

<th>Jméno</th>

<th>Akce</th>

<th>Nejlepší</th>

<th>Pokus 1</th>

</tr>

</thead>

<tbody id="vysledky">

</tbody>

</table>

</div>

<script>

let soutezici=[];

let dalsiId=1;

let maxPokusu=1;
    document
.getElementById("pridatSouteziciho")
.addEventListener("click",function(){

const prijmeni=
document.getElementById("prijmeni").value.trim();

const jmeno=
document.getElementById("jmeno").value.trim();

if(prijmeni=="" || jmeno==""){

alert("Vyplň příjmení a jméno.");

return;

}

soutezici.push({

id:dalsiId++,

prijmeni:prijmeni,

jmeno:jmeno,

nejlepsi:"",

pokusy:[]

});

document.getElementById("prijmeni").value="";
document.getElementById("jmeno").value="";

document.getElementById("prijmeni").focus();

vykresliTabulku();

});

function vykresliTabulku(){

const tbody=document.getElementById("vysledky");

tbody.innerHTML="";

soutezici.forEach(function(z,index){

const radek=document.createElement("tr");

let html="";

html+="<td>"+(index+1)+"</td>";

html+="<td>"+z.prijmeni+"</td>";

html+="<td>"+z.jmeno+"</td>";

html+=`
<td class="akce">
<button>➕</button>
<button>✏️</button>
<button>🗑️</button>
</td>
`;

html+="<td>"+(z.nejlepsi=="" ? "-" : z.nejlepsi)+"</td>";

for(let i=0;i<maxPokusu;i++){

html+="<td>"+(z.pokusy[i] ?? "")+"</td>";

}

radek.innerHTML=html;

tbody.appendChild(radek);

});

}
    
</script>

</body>
</html>
