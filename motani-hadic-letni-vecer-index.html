<!DOCTYPE html>
<html lang="cs">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motání hadic</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#ececec;
padding:20px;
}

.container{
max-width:1800px;
margin:auto;
background:#fff;
padding:25px;
border-radius:12px;
}

h1{
text-align:center;
color:#c62828;
}

.karta{
background:#fafafa;
padding:20px;
margin-top:20px;
border-radius:10px;
}

input{
padding:10px;
margin:5px;
}

button{
padding:8px 12px;
background:#2e7d32;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

table{
width:100%;
margin-top:20px;
border-collapse:collapse;
}

th,td{
border:1px solid #ccc;
padding:8px;
text-align:center;
}

th{
background:#c62828;
color:white;
}

</style>
</head>

<body>

<div class="container">

<h1>🚒 SDH Lubina – Motání hadic</h1>

<div class="karta">

<h3>Přidání soutěžícího</h3>

<input id="prijmeni" placeholder="Příjmení">
<input id="jmeno" placeholder="Jméno">
<button id="btnPridat">Přidat</button>

</div>

<div class="karta">

<table>
<thead>
<tr id="hlavicka">
<th>Poř.</th>
<th>Příjmení</th>
<th>Jméno</th>
<th>Akce</th>
<th>Nejlepší</th>
<th>Pokus 1</th>
</tr>
</thead>

<tbody id="vysledky"></tbody>

</table>

</div>

<script>

let soutezici = [];
let dalsiId = 1;
let maxPokusu = 1;

document.getElementById("btnPridat").addEventListener("click", pridejSouteziciho);

function pridejSouteziciho() {

    const prijmeni = document.getElementById("prijmeni").value.trim();
    const jmeno = document.getElementById("jmeno").value.trim();

    if (!prijmeni || !jmeno) {
        alert("Vyplň příjmení i jméno.");
        return;
    }

    soutezici.push({
        id: dalsiId++,
        prijmeni,
        jmeno,
        pokusy: [],
        nejlepsi: ""
    });

    document.getElementById("prijmeni").value = "";
    document.getElementById("jmeno").value = "";

    vykresliTabulku();
}

function vykresliTabulku() {

    const tbody = document.getElementById("vysledky");
    tbody.innerHTML = "";

    soutezici.forEach((z, index) => {

        const tr = document.createElement("tr");

        tr.insertCell().textContent = index + 1;
        tr.insertCell().textContent = z.prijmeni;
        tr.insertCell().textContent = z.jmeno;

        // AKCE
        const akce = tr.insertCell();

        const btnPlus = document.createElement("button");
        btnPlus.textContent = "➕";
        btnPlus.onclick = () => pridatPokus(z.id);

        const btnEdit = document.createElement("button");
        btnEdit.textContent = "✏️";
        btnEdit.onclick = () => {
            const p = prompt("Příjmení:", z.prijmeni);
            if (p === null) return;

            const j = prompt("Jméno:", z.jmeno);
            if (j === null) return;

            z.prijmeni = p.trim();
            z.jmeno = j.trim();

            vykresliTabulku();
        };

        const btnDel = document.createElement("button");
        btnDel.textContent = "🗑️";
        btnDel.onclick = () => {

            if (confirm("Smazat soutěžícího?")) {
                soutezici = soutezici.filter(s => s.id !== z.id);
                vykresliTabulku();
            }

        };

        akce.appendChild(btnPlus);
        akce.appendChild(btnEdit);
        akce.appendChild(btnDel);

        // nejlepší
        tr.insertCell().textContent = z.nejlepsi || "-";

        // pokusy
        for (let i = 0; i < maxPokusu; i++) {

            const td = tr.insertCell();

            if (z.pokusy[i]) {
                td.textContent = z.pokusy[i];
                td.style.cursor = "pointer";

                td.onclick = () => upravitPokus(z.id, i);
            }
        }

        tbody.appendChild(tr);
    });
}

function pridatPokus(id) {

    const cas = prompt("Zadej čas (např. 15:23)");
    if (!cas) return;

    const z = soutezici.find(s => s.id === id);

    z.pokusy.push(cas);

    // sloupce
    if (z.pokusy.length > maxPokusu) {
        maxPokusu = z.pokusy.length;

        const th = document.createElement("th");
        th.textContent = "Pokus " + maxPokusu;

        document.getElementById("hlavicka").appendChild(th);
    }

    // nejlepší čas
    let nej = z.pokusy[0];

    for (let i = 1; i < z.pokusy.length; i++) {

        const [m1, s1] = nej.split(":").map(Number);
        const [m2, s2] = z.pokusy[i].split(":").map(Number);

        if ((m2 * 60 + s2) < (m1 * 60 + s1)) {
            nej = z.pokusy[i];
        }
    }

    z.nejlepsi = nej;

    vykresliTabulku();
}

function upravitPokus(id, index) {

    const z = soutezici.find(s => s.id === id);

    const novy = prompt("Upravit čas:", z.pokusy[index]);
    if (!novy) return;

    z.pokusy[index] = novy;

    // přepočet
    let nej = z.pokusy[0];

    for (let i = 1; i < z.pokusy.length; i++) {

        const [m1, s1] = nej.split(":").map(Number);
        const [m2, s2] = z.pokusy[i].split(":").map(Number);

        if ((m2 * 60 + s2) < (m1 * 60 + s1)) {
            nej = z.pokusy[i];
        }
    }

    z.nejlepsi = nej;

    vykresliTabulku();
}
 </script>

</body>
</html>
