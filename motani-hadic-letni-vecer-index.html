<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Motání hadic na čas</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#ececec;
padding:20px;
}

.container{
max-width:1200px;
margin:auto;
background:#fff;
padding:25px;
border-radius:10px;
box-shadow:0 0 15px rgba(0,0,0,.15);
}

h1{
text-align:center;
color:#c62828;
margin-bottom:5px;
}

h2{
text-align:center;
color:#666;
margin-bottom:30px;
}

h3{
margin:25px 0 15px;
}

.form-group{
margin-bottom:15px;
}

label{
display:block;
font-weight:bold;
margin-bottom:5px;
}

input{
width:100%;
padding:10px;
font-size:16px;
border:1px solid #ccc;
border-radius:5px;
}

.buttons{
margin-top:20px;
display:flex;
gap:10px;
flex-wrap:wrap;
}

button{
padding:10px 20px;
background:#2e7d32;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

button:hover{
opacity:.9;
}

table{
width:100%;
border-collapse:collapse;
margin-top:25px;
}

th{
background:#c62828;
color:white;
padding:10px;
}

td{
border:1px solid #ddd;
padding:8px;
text-align:center;
}

</style>

</head>

<body>

<div class="container">

<h1>🚒 Letní večer SDH Lubina II Větřkovice</h1>
<h2>18. 7. 2026</h2>

<h3>Přidání soutěžícího</h3>

<div class="form-group">

<label>Příjmení</label>

<input id="prijmeni">

</div>

<div class="form-group">

<label>Jméno</label>

<input id="jmeno">

</div>

<div id="pokusy">

<div class="form-group">

<label>Čas 1. pokusu</label>

<input class="cas">

</div>

</div>

<div class="buttons">

<button id="pridatPokus" type="button">
➕ Přidat další pokus
</button>

<button id="ulozit" type="button">
💾 Přidat soutěžícího
</button>

</div>
<h3>Seznam soutěžících</h3>

<table id="tabulka">

<thead>

<tr>

<th width="50">#</th>
<th>Příjmení</th>
<th>Jméno</th>
<th width="300">Pokusy</th>
<th width="130">Nejlepší čas</th>
<th width="90">Akce</th>

</tr>

</thead>

<tbody id="vysledky">

</tbody>

</table>

</div>

<script>

let poradi = 1;

let pocetPokusu = 1;

let soutezici = [];

document
.getElementById("pridatPokus")
.addEventListener("click",function(){

    pocetPokusu++;

    const blok = document.createElement("div");

    blok.className = "form-group";

    blok.innerHTML = `
        <label>Čas ${pocetPokusu}. pokusu</label>
        <input class="cas">
    `;

    document
    .getElementById("pokusy")
    .appendChild(blok);

});

document
.getElementById("ulozit")
.addEventListener("click",ulozitSouteziciho);

function ulozitSouteziciho(){

    const prijmeni =
    document.getElementById("prijmeni").value.trim();

    const jmeno =
    document.getElementById("jmeno").value.trim();

    if(prijmeni==="" || jmeno===""){

        alert("Vyplň příjmení a jméno.");

        return;

    }

    const pokusy = [];

    document
    .querySelectorAll(".cas")
    .forEach(function(pole){

        const cas = pole.value.trim();

        if(cas!==""){

            pokusy.push(cas);

        }

    });

    if(pokusy.length===0){

        alert("Zadej alespoň jeden čas.");

        return;

    }
    let nejlepsi = pokusy[0];

    pokusy.forEach(function(cas){

        if(
            parseFloat(cas.replace(",", ".")) <
            parseFloat(nejlepsi.replace(",", "."))
        ){
            nejlepsi = cas;
        }

    });

    soutezici.push({

        poradi: poradi,
        prijmeni: prijmeni,
        jmeno: jmeno,
        pokusy: pokusy,
        nejlepsi: nejlepsi

    });

    vykresliTabulku();

    poradi++;

    document.getElementById("prijmeni").value="";
    document.getElementById("jmeno").value="";

    document.getElementById("pokusy").innerHTML=`
        <div class="form-group">
            <label>Čas 1. pokusu</label>
            <input class="cas">
        </div>
    `;

    pocetPokusu=1;

    document.getElementById("prijmeni").focus();

}

function vykresliTabulku(){

    const tbody =
    document.getElementById("vysledky");

    tbody.innerHTML="";

    soutezici.forEach(function(zavodnik,index){

        const radek =
        document.createElement("tr");

        radek.innerHTML=`

<td>${zavodnik.poradi}</td>

<td>${zavodnik.prijmeni}</td>

<td>${zavodnik.jmeno}</td>

<td>${zavodnik.pokusy.join("<br>")}</td>

<td><b>${zavodnik.nejlepsi}</b></td>

<td>
<button onclick="smazatSouteziciho(${index})">
🗑️
</button>
</td>

`;

        tbody.appendChild(radek);

    });

}
function smazatSouteziciho(index){

    if(!confirm("Opravdu smazat soutěžícího?")){
        return;
    }

    soutezici.splice(index,1);

    soutezici.forEach(function(zavodnik,i){
        zavodnik.poradi = i + 1;
    });

    poradi = soutezici.length + 1;

    vykresliTabulku();

}

</script>

</body>
</html>
