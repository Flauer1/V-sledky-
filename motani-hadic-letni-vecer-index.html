<!DOCTYPE html>
<html lang="cs">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Motání hadic na čas</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#ececec;
    padding:20px;
}

.container{
    max-width:1400px;
    margin:auto;
    background:#ffffff;
    border-radius:12px;
    padding:25px;
    box-shadow:0 0 20px rgba(0,0,0,.15);
}

header{
    text-align:center;
    margin-bottom:30px;
}

header h1{
    color:#c62828;
    font-size:34px;
    margin-bottom:8px;
}

header h2{
    color:#666;
    font-size:20px;
    font-weight:normal;
}

.card{

    background:#fafafa;
    border:1px solid #ddd;
    border-radius:10px;
    padding:20px;
    margin-bottom:25px;

}

.card h3{

    color:#c62828;
    margin-bottom:20px;

}

.form-group{

    margin-bottom:15px;

}

label{

    display:block;
    font-weight:bold;
    margin-bottom:6px;

}

input{

    width:100%;
    padding:10px;
    border:1px solid #bbb;
    border-radius:5px;
    font-size:16px;

}

.buttons{

    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:20px;

}

button{

    border:none;
    border-radius:5px;
    padding:10px 18px;
    cursor:pointer;
    color:white;
    font-size:15px;

}

#pridatPokus{

    background:#1976d2;

}

#ulozit{

    background:#2e7d32;

}

#export{

    background:#ef6c00;

}

#import{

    background:#6a1b9a;

}

#qr{

    background:#455a64;

}

table{

    width:100%;
    border-collapse:collapse;
    margin-top:20px;

}

th{

    background:#c62828;
    color:white;
    padding:10px;

}

td{

    border:1px solid #ddd;
    padding:8px;
    text-align:center;

}

tr:nth-child(even){

    background:#f8f8f8;

}

.nejlepsi{

    background:#c8e6c9;
    font-weight:bold;

}

@media(max-width:900px){

    .buttons{

        flex-direction:column;

    }

}

</style>

</head>

<body>

<div class="container">

<header>

<h1>🚒 Letní večer SDH Lubina II Větřkovice</h1>

<h2>18. července 2026</h2>

</header>

<div class="card">

<h3>Přidání soutěžícího</h3>

<div class="form-group">

<label>Příjmení</label>

<input id="prijmeni">

</div>

<div class="form-group">

<label>Jméno</label>

<input id="jmeno">

</div>

<div id="pokusy">

<div class="form-group">

<label>Čas 1. pokusu</label>

<input
class="cas"
type="number"
step="0.01"
min="0"
placeholder="15.23">

</div>

</div>

<div class="buttons">

<button
id="pridatPokus"
type="button">

➕ Přidat další pokus

</button>

<button
id="ulozit"
type="button">

💾 Přidat soutěžícího

</button>

</div>

</div>
<div class="card">

<h3>📊 Statistiky</h3>

<p><b>Soutěžících:</b>
<span id="statSoutezicich">0</span></p>

<p><b>Počet pokusů:</b>
<span id="statPokusu">0</span></p>

<p><b>Nejlepší čas:</b>
<span id="statNejlepsi">-</span></p>

<br>

<input
type="text"
id="vyhledavani"
placeholder="🔍 Vyhledat soutěžícího...">

</div>

<div class="card">

<h3>🏆 Výsledky soutěže</h3>

<table id="tabulka">

<thead>

<tr>

<th width="60">
Pořadí
</th>

<th>
Příjmení
</th>

<th>
Jméno
</th>

<th width="300">
Pokusy
</th>

<th width="120">
Nejlepší čas
</th>

<th width="180">
Akce
</th>

</tr>

</thead>

<tbody id="vysledky">

</tbody>

</table>

<div class="buttons">

<button
id="export"
type="button">

📤 Export

</button>

<button
id="import"
type="button">

📥 Import

</button>

<button
id="qr"
type="button">

📱 QR výsledky

</button>

</div>

</div>

<script>

/**************************************************

MOTÁNÍ HADIC NA ČAS
Verze 1.0

**************************************************/

let soutezici=[];

let dalsiId=1;

let pocetPokusu=1;


/**************************************************
PŘIDÁNÍ DALŠÍHO POKUSU
**************************************************/

document
.getElementById("pridatPokus")
.addEventListener("click",function(){

    pocetPokusu++;

    const blok=document.createElement("div");

    blok.className="form-group";

    blok.innerHTML=`

<label>Čas ${pocetPokusu}. pokusu</label>

<input
class="cas"
type="number"
step="0.01"
min="0"
placeholder="15.23">

`;

    document
    .getElementById("pokusy")
    .appendChild(blok);

});


/**************************************************
PŘIDÁNÍ SOUTĚŽÍCÍHO
**************************************************/

document
.getElementById("ulozit")
.addEventListener("click",pridatSouteziciho);


function pridatSouteziciho(){

const prijmeni=
document
.getElementById("prijmeni")
.value
.trim();

const jmeno=
document
.getElementById("jmeno")
.value
.trim();

if(prijmeni=="" || jmeno==""){

alert("Vyplň příjmení a jméno.");

return;

}

const pokusy=[];

document
.querySelectorAll(".cas")
.forEach(function(pole){

const hodnota=
pole.value.trim();

if(hodnota!=""){

pokusy.push(parseFloat(hodnota));

}

});

if(pokusy.length==0){

alert("Zadej alespoň jeden čas.");

return;

}

const nejlepsi=
Math.min(...pokusy);

soutezici.push({

id:dalsiId++,

prijmeni:prijmeni,

jmeno:jmeno,

pokusy:pokusy,

nejlepsi:nejlepsi

});

vykresliTabulku();

obnovStatistiky();

vycistitFormular();

ulozitData();

}
    /**************************************************
VYKRESLENÍ TABULKY
**************************************************/

function vykresliTabulku(){

const tbody=document.getElementById("vysledky");

tbody.innerHTML="";

soutezici.sort(function(a,b){

return a.nejlepsi-b.nejlepsi;

});

soutezici.forEach(function(zavodnik,index){

const radek=document.createElement("tr");

radek.innerHTML=`

<td>${index+1}</td>

<td>${zavodnik.prijmeni}</td>

<td>${zavodnik.jmeno}</td>

<td>${zavodnik.pokusy.join(" | ")}</td>

<td class="nejlepsi">

${zavodnik.nejlepsi.toFixed(2)}

</td>

<td>

<button
onclick="smazatSouteziciho(${zavodnik.id})">

🗑️ Smazat

</button>

</td>

`;

tbody.appendChild(radek);

});

}


/**************************************************
SMAZÁNÍ SOUTĚŽÍCÍHO
**************************************************/

function smazatSouteziciho(id){

if(!confirm("Opravdu smazat soutěžícího?")){

return;

}

soutezici=soutezici.filter(function(z){

return z.id!=id;

});

vykresliTabulku();

obnovStatistiky();

ulozitData();

}


/**************************************************
VYČIŠTĚNÍ FORMULÁŘE
**************************************************/

function vycistitFormular(){

document.getElementById("prijmeni").value="";

document.getElementById("jmeno").value="";

document.getElementById("pokusy").innerHTML=`

<div class="form-group">

<label>Čas 1. pokusu</label>

<input
class="cas"
type="number"
step="0.01"
min="0"
placeholder="15.23">

</div>

`;

pocetPokusu=1;

document.getElementById("prijmeni").focus();

}
    /**************************************************
STATISTIKY
**************************************************/

function obnovStatistiky(){

document.getElementById("statSoutezicich").textContent=soutezici.length;

let pocet=0;

let nej="-";

if(soutezici.length>0){

nej=soutezici[0].nejlepsi;

}

soutezici.forEach(function(z){

pocet+=z.pokusy.length;

if(z.nejlepsi<nej){

nej=z.nejlepsi;

}

});

document.getElementById("statPokusu").textContent=pocet;

document.getElementById("statNejlepsi").textContent=nej;

}


/**************************************************
ULOŽENÍ DAT
**************************************************/

function ulozitData(){

localStorage.setItem(

"motaniHadic",

JSON.stringify(soutezici)

);

}


/**************************************************
NAČTENÍ DAT
**************************************************/

function nacistData(){

const data=

localStorage.getItem("motaniHadic");

if(!data){

return;

}

soutezici=JSON.parse(data);

if(soutezici.length>0){

dalsiId=

Math.max(...soutezici.map(z=>z.id))+1;

}

vykresliTabulku();

obnovStatistiky();

}

nacistData();


/**************************************************
VYHLEDÁVÁNÍ
**************************************************/

document
.getElementById("vyhledavani")
.addEventListener("input",function(){

const text=

this.value.toLowerCase();

document
.querySelectorAll("#vysledky tr")
.forEach(function(radek){

if(

radek.innerText
.toLowerCase()
.includes(text)

){

radek.style.display="";

}else{

radek.style.display="none";

}

});

});

</script>

</body>
</html>
