<!DOCTYPE html>
<html lang="cs">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motání hadic</title>

<style>
body{
font-family:Arial;
background:#ececec;
padding:20px;
}

.container{
max-width:1100px;
margin:auto;
background:#fff;
padding:20px;
border-radius:10px;
}

header{
text-align:center;
margin-bottom:20px;
}

input,button{
padding:10px;
margin:5px;
}

button{
background:#2e7d32;
color:#fff;
border:none;
border-radius:5px;
cursor:pointer;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th,td{
border:1px solid #ccc;
padding:8px;
text-align:center;
}

th{
background:#c62828;
color:white;
}
</style>
</head>

<body>

<div class="container">

<header>
<h1>🚒 Letní večer SDH Lubina II Větřkovice</h1>
<h2>18. července 2026</h2>
</header>

<div>
<input id="prijmeni" placeholder="Příjmení">
<input id="jmeno" placeholder="Jméno">
<button onclick="pridat()">Přidat</button>
</div>

<table>
<thead>
<tr>
<th>#</th>
<th>Příjmení</th>
<th>Jméno</th>
<th>Akce</th>
</tr>
</thead>

<tbody id="tab"></tbody>
</table>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
getFirestore,
collection,
addDoc,
onSnapshot,
deleteDoc,
doc,
updateDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
apiKey: "XXX",
authDomain: "XXX",
projectId: "XXX"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const col = collection(db, "motani_hadic");

let data = [];

/* ================= REALTIME ================= */
onSnapshot(col, (snap) => {

data = [];

snap.forEach(d => {
data.push({ id: d.id, ...d.data() });
});

render();

});

/* ================= ADD ================= */
window.pridat = async function(){

const p = document.getElementById("prijmeni").value.trim();
const j = document.getElementById("jmeno").value.trim();

if(!p || !j) return;

await addDoc(col,{
prijmeni:p,
jmeno:j,
pokusy:[],
nejlepsi:""
});

document.getElementById("prijmeni").value="";
document.getElementById("jmeno").value="";
};

/* ================= DELETE ================= */
window.smaz = async function(id){
await deleteDoc(doc(db,"motani_hadic",id));
};

/* ================= EDIT ================= */
window.edit = async function(id){

const z = data.find(s=>s.id===id);

const p = prompt("Příjmení:", z.prijmeni);
if(!p) return;

const j = prompt("Jméno:", z.jmeno);
if(!j) return;

await updateDoc(doc(db,"motani_hadic",id),{
prijmeni:p,
jmeno:j
});

};

/* ================= RENDER ================= */
window.render = function(){

const t = document.getElementById("tab");
t.innerHTML = "";

data.forEach((z,i)=>{

t.innerHTML += `
<tr>
<td>${i+1}</td>
<td>${z.prijmeni}</td>
<td>${z.jmeno}</td>
<td>
<button onclick="edit('${z.id}')">✏️</button>
<button onclick="smaz('${z.id}')">🗑️</button>
</td>
</tr>
`;

});

};

</script>

</body>
</html>
