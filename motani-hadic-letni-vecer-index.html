<!DOCTYPE html>
<html lang="cs">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Motání hadic na čas</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#ececec;
padding:20px;
}

.container{
max-width:1500px;
margin:auto;
background:#fff;
padding:25px;
border-radius:12px;
box-shadow:0 0 20px rgba(0,0,0,.15);
}

h1{
text-align:center;
color:#c62828;
margin-bottom:5px;
}

h2{
text-align:center;
color:#666;
margin-bottom:30px;
font-weight:normal;
}

.card{
background:#fafafa;
border:1px solid #ddd;
border-radius:10px;
padding:20px;
margin-bottom:25px;
}

.card h3{
margin-bottom:20px;
color:#c62828;
}

.form{
display:flex;
gap:15px;
align-items:end;
flex-wrap:wrap;
}

.form div{
flex:1;
min-width:220px;
}

label{
display:block;
margin-bottom:5px;
font-weight:bold;
}

input{
width:100%;
padding:10px;
font-size:16px;
}

button{
padding:10px 18px;
border:none;
border-radius:5px;
cursor:pointer;
font-size:15px;
color:white;
background:#2e7d32;
}

button:hover{
opacity:.9;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th{
background:#c62828;
color:white;
padding:10px;
}

td{
border:1px solid #ddd;
padding:8px;
text-align:center;
}

tr:nth-child(even){
background:#f7f7f7;
}

.nejlepsi{
background:#c8e6c9;
font-weight:bold;
}

.ikona{
cursor:pointer;
font-size:18px;
margin:0 3px;
}

</style>

</head>

<body>

<div class="container">

<h1>🚒 Letní večer SDH Lubina II Větřkovice</h1>

<h2>18. července 2026</h2>

<div class="card">

<h3>Přidání soutěžícího</h3>

<div class="form">

<div>

<label>Příjmení</label>

<input id="prijmeni">

</div>

<div>

<label>Jméno</label>

<input id="jmeno">

</div>

<div>

<button id="pridat">

➕ Přidat soutěžícího

</button>

</div>

</div>

</div>

<div class="card">

<h3>Výsledky</h3>

<table id="tabulka">

<thead>

<tr>

<th>Poř.</th>

<th>Příjmení</th>

<th>Jméno</th>

<th>Akce</th>

<th>Nejlepší</th>

<th>Pokus 1</th>

</tr>

</thead>

<tbody id="vysledky">

</tbody>

</table>

</div>

<script>

let soutezici=[];

let dalsiId=1;

let maxPokusu=1;
    document
.getElementById("pridat")
.addEventListener("click",pridatSouteziciho);

function pridatSouteziciho(){

const prijmeni=
document.getElementById("prijmeni").value.trim();

const jmeno=
document.getElementById("jmeno").value.trim();

if(prijmeni=="" || jmeno==""){

alert("Vyplň příjmení a jméno.");

return;

}

soutezici.push({

id:dalsiId++,

prijmeni:prijmeni,

jmeno:jmeno,

nejlepsi:null,

pokusy:[]

});

vykresliTabulku();

document.getElementById("prijmeni").value="";
document.getElementById("jmeno").value="";

document.getElementById("prijmeni").focus();

}
    function vykresliTabulku(){

const tbody=document.getElementById("vysledky");

tbody.innerHTML="";

soutezici.forEach(function(z,index){

const radek=document.createElement("tr");

let html=`

<td>${index+1}</td>

<td>${z.prijmeni}</td>

<td>${z.jmeno}</td>

<td>

<button onclick="pridatPokus(${z.id})">➕</button>

<button onclick="upravitSouteziciho(${z.id})">✏️</button>

<button onclick="smazatSouteziciho(${z.id})">🗑️</button>

</td>

<td>${z.nejlepsi ?? "-"}</td>

`;

for(let i=0;i<maxPokusu;i++){

html+=`<td>${z.pokusy[i] ?? ""}</td>`;

}

radek.innerHTML=html;

tbody.appendChild(radek);

});

}
    function pridatPokus(id){

const cas=prompt("Zadej čas (např. 15:23)");

if(cas===null) return;

const hodnota=cas.trim();

if(hodnota==="") return;

const zavodnik=soutezici.find(z=>z.id===id);

zavodnik.pokusy.push(hodnota);

// přepočet nejlepšího času

zavodnik.nejlepsi=zavodnik.pokusy.reduce(function(a,b){

const aa=parseFloat(a.replace(":","."));

const bb=parseFloat(b.replace(":","."));

return aa<bb ? a : b;

});

// pokud přibyl nový pokus,
// přidáme nový sloupec

if(zavodnik.pokusy.length>maxPokusu){

maxPokusu=zavodnik.pokusy.length;

// přidání nové hlavičky

const hlavicka=document.querySelector("#tabulka thead tr");

const th=document.createElement("th");

th.textContent="Pokus "+maxPokusu;

hlavicka.appendChild(th);

}

// seřazení podle nejlepšího času

soutezici.sort(function(a,b){

if(a.nejlepsi===null) return 1;

if(b.nejlepsi===null) return -1;

return parseFloat(a.nejlepsi.replace(":","."))-
parseFloat(b.nejlepsi.replace(":","."));

});

vykresliTabulku();

}
