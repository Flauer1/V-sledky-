<!DOCTYPE html>
<html lang="cs">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motání hadic</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#ececec;
padding:20px;
}

.container{
max-width:1800px;
margin:auto;
background:#fff;
padding:25px;
border-radius:12px;
}

header{
text-align:center;
margin-bottom:20px;
}

h1{
color:#c62828;
}

.karta{
background:#fafafa;
padding:20px;
margin-top:20px;
border-radius:10px;
}

input{
padding:10px;
margin:5px;
}

button{
padding:8px 12px;
background:#2e7d32;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

table{
width:100%;
margin-top:20px;
border-collapse:collapse;
}

th,td{
border:1px solid #ccc;
padding:8px;
text-align:center;
}

th{
background:#c62828;
color:white;
}

.nejlepsi{
background:#c8e6c9;
font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<header>
<h1>🚒 Letní večer SDH Lubina II Větřkovice</h1>
<h2>18. července 2026</h2>
</header>

<div class="karta">
<h3>Přidání soutěžícího</h3>

<input id="prijmeni" placeholder="Příjmení">
<input id="jmeno" placeholder="Jméno">
<button id="btnPridat">Přidat</button>
</div>

<div class="karta">

<table>
<thead>
<tr id="hlavicka">
<th>Poř.</th>
<th>Příjmení</th>
<th>Jméno</th>
<th>Akce</th>
<th>Nejlepší</th>
<th>Pokus 1</th>
</tr>
</thead>

<tbody id="vysledky"></tbody>
</table>

</div>

</div>

<script>

let soutezici = [];
let dalsiId = 1;
let maxPokusu = 1;

document.getElementById("btnPridat").addEventListener("click", pridejSouteziciho);

function pridejSouteziciho(){

const p = document.getElementById("prijmeni").value.trim();
const j = document.getElementById("jmeno").value.trim();

if(!p || !j) return;

soutezici.push({
id: dalsiId++,
prijmeni: p,
jmeno: j,
pokusy: [],
nejlepsi: ""
});

document.getElementById("prijmeni").value="";
document.getElementById("jmeno").value="";

vykresli();
}

function vykresli(){

const tbody = document.getElementById("vysledky");
tbody.innerHTML="";

soutezici.forEach((z,i)=>{

const tr = document.createElement("tr");

tr.innerHTML = `
<td>${i+1}</td>
<td>${z.prijmeni}</td>
<td>${z.jmeno}</td>
<td>
<button onclick="pridatPokus(${z.id})">➕</button>
<button onclick="edit(${z.id})">✏️</button>
<button onclick="smaz(${z.id})">🗑️</button>
</td>
<td class="${z.nejlepsi ? 'nejlepsi' : ''}">${z.nejlepsi || '-'}</td>
`;

for(let i=0;i<maxPokusu;i++){
tr.innerHTML += `<td>${z.pokusy[i] || ''}</td>`;
}

tbody.appendChild(tr);

});

}

function pridatPokus(id){

const cas = prompt("Zadej čas (15:23)");
if(!cas) return;

const z = soutezici.find(s=>s.id===id);

z.pokusy.push(cas);

// nové sloupce
if(z.pokusy.length > maxPokusu){

maxPokusu = z.pokusy.length;

const th = document.createElement("th");
th.textContent = "Pokus " + maxPokusu;

document.getElementById("hlavicka").appendChild(th);
}

// výpočet nejlepšího času (SAFE)
if(z.pokusy.length === 0) return;

let nej = z.pokusy[0];

for(let i=1;i<z.pokusy.length;i++){

const [m1,s1] = nej.split(":").map(Number);
const [m2,s2] = z.pokusy[i].split(":").map(Number);

if((m2*60+s2) < (m1*60+s1)){
nej = z.pokusy[i];
}

}

z.nejlepsi = nej;

vykresli();
}

function edit(id){

const z = soutezici.find(s=>s.id===id);

const p = prompt("Příjmení:", z.prijmeni);
if(p===null || p.trim()==="") return;

const j = prompt("Jméno:", z.jmeno);
if(j===null || j.trim()==="") return;

z.prijmeni = p.trim();
z.jmeno = j.trim();

vykresli();
}

function smaz(id){

soutezici = soutezici.filter(s=>s.id!==id);
vykresli();

}

function upravitPokus(id,index){

const z = soutezici.find(s=>s.id===id);

const novy = prompt("Upravit čas:", z.pokusy[index]);
if(!novy) return;

z.pokusy[index]=novy;

// přepočet
let nej = z.pokusy[0];

for(let i=1;i<z.pokusy.length;i++){

const [m1,s1] = nej.split(":").map(Number);
const [m2,s2] = z.pokusy[i].split(":").map(Number);

if((m2*60+s2) < (m1*60+s1)){
nej = z.pokusy[i];
}

}

z.nejlepsi = nej;

vykresli();

}

</script>

</body>
</html>
