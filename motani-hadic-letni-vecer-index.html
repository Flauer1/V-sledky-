<!DOCTYPE html>
<html lang="cs">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SDH Motání hadic</title>

<style>
body{
font-family:Arial;
background:#ececec;
padding:20px;
}

.container{
max-width:1200px;
margin:auto;
background:white;
padding:20px;
border-radius:10px;
}

header{
text-align:center;
margin-bottom:20px;
}

input{
padding:10px;
margin:5px;
}

button{
padding:8px 12px;
background:#2e7d32;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th,td{
border:1px solid #ccc;
padding:8px;
text-align:center;
}

th{
background:#c62828;
color:white;
}

</style>
</head>

<body>

<div class="container">

<header>
<h1>🚒 SDH Lubina – Motání hadic</h1>
<h3>Firestore verze</h3>
</header>

<div>
<input id="prijmeni" placeholder="Příjmení">
<input id="jmeno" placeholder="Jméno">
<button onclick="pridat()">Přidat</button>
</div>

<table>
<thead>
<tr>
<th>#</th>
<th>Příjmení</th>
<th>Jméno</th>
<th>Nejlepší</th>
<th>Akce</th>
</tr>
</thead>
<tbody id="tab"></tbody>
</table>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
getFirestore,
collection,
addDoc,
onSnapshot,
deleteDoc,
doc,
updateDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";


// 🔥 SEM DOPLŇ SVŮJ CONFIG
const firebaseConfig = {
apiKey: "XXX",
authDomain: "XXX",
projectId: "XXX"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const col = collection(db, "soutez");

let data = [];

// realtime načítání
onSnapshot(col, (snap) => {

data = [];

snap.forEach(d => {
data.push({ id: d.id, ...d.data() });
});

render();

});

window.pridat = async function(){

const p = document.getElementById("prijmeni").value;
const j = document.getElementById("jmeno").value;

if(!p || !j) return;

await addDoc(col,{
prijmeni:p,
jmeno:j,
nejlepsi:"-"
});

document.getElementById("prijmeni").value="";
document.getElementById("jmeno").value="";
}

window.smaz = async function(id){
await deleteDoc(doc(db,"soutez",id));
}

window.render = function(){

const t = document.getElementById("tab");
t.innerHTML="";

data.forEach((z,i)=>{

t.innerHTML += `
<tr>
<td>${i+1}</td>
<td>${z.prijmeni}</td>
<td>${z.jmeno}</td>
<td>${z.nejlepsi || "-"}</td>
<td>
<button onclick="smaz('${z.id}')">🗑️</button>
</td>
</tr>
`;

});

}

</script>

</body>
</html>
